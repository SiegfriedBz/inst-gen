name: check

on:
  pull_request:
  push:
    branches: [main, develop]

# Test values, not secrets: the same ones playwright.config.ts falls back to.
env:
  PILOT_PASSPHRASES: test-lotus-river-sen,test-blue-wave-svarga,test-quiet-stone-dev
  SESSION_SECRET: test-session-secret-not-for-production-0001

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Keep in step with .prototools (setup-node can't read it).
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Docs and repo checks, biome ci, typecheck and Vitest.
      - run: pnpm check

  e2e:
    runs-on: ubuntu-latest
    # Playwright's own image: Chromium and the system packages it needs are
    # already in it. Installing those packages with apt took up to 13 minutes
    # on some runs. The tag must match @playwright/test in package.json: when
    # they differ, Playwright stops with "Executable doesn't exist".
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
